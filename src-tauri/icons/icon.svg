<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="#1a6b3c"/>

  <!-- Briefcase body -->
  <rect x="120" y="160" width="272" height="200" rx="16" fill="white" stroke="#1a6b3c" stroke-width="8"/>

  <!-- Briefcase top handle -->
  <path d="M 180 160 Q 180 100, 256 100 Q 332 100, 332 160" fill="none" stroke="white" stroke-width="16" stroke-linecap="round"/>

  <!-- Briefcase divider/lock -->
  <rect x="240" y="150" width="32" height="40" rx="4" fill="#1a6b3c"/>

  <!-- Checkmark inside briefcase -->
  <g transform="translate(256, 260)">
    <!-- Checkmark circle background -->
    <circle cx="0" cy="0" r="50" fill="#1a6b3c"/>
    <!-- Checkmark -->
    <path d="M -20 5 L -5 20 L 25 -10" stroke="white" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Bottom detail line -->
  <rect x="120" y="340" width="272" height="8" rx="4" fill="#1a6b3c" opacity="0.3"/>

  <!-- Corner accents -->
  <circle cx="140" cy="180" r="6" fill="#1a6b3c" opacity="0.5"/>
  <circle cx="372" cy="180" r="6" fill="#1a6b3c" opacity="0.5"/>
  <circle cx="140" cy="320" r="6" fill="#1a6b3c" opacity="0.5"/>
  <circle cx="372" cy="320" r="6" fill="#1a6b3c" opacity="0.5"/>
</svg>
